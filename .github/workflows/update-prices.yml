name: Update prices and rebuild

on:
  schedule:
    - cron: '17 1 * * *'   # every day at 01:17 UTC
  workflow_dispatch: {}    # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ['src/**', 'data/assets.json', 'scripts/build.py']

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install yfinance pandas
      - name: Fetch prices
        if: github.event_name != 'push'
        run: python scripts/update_prices.py
      - name: Build site
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "whatif-bot"
          git config user.email "whatif-bot@users.noreply.github.com"
          git add data whatif
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update prices $(date -u +%F)"
          git push
