name: Fetch market data

on:
  schedule:
    - cron: '17 1 * * *'    # daily 01:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/fetch_data.py', 'data/assets.json', 'data/markets.json', '.github/workflows/update-prices.yml']

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas pillow
      - name: Fetch prices from Binance, Yahoo Finance, CoinGecko
        run: python scripts/fetch_data.py
      - name: Check the site still builds
        run: python scripts/build.py
      - name: Pack top logos into one sprite (build.py wrote data/sprite_ids.json)
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import fetch_data; fetch_data.make_sprite()"
      - name: Commit data
        run: |
          git config user.name "whatif-bot"
          git config user.email "whatif-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Market data $(date -u +%F)"
          git pull --rebase -X theirs || (git rebase --abort; git pull --rebase -X theirs)
          git push
