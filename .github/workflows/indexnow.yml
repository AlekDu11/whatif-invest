name: IndexNow ping (Bing, Yandex, Seznam, Naver)

on:
  push:
    branches: [main]
    paths: ['content/**', 'data/market.json', 'scripts/**']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every sitemap URL (one-off)'
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the Vercel deploy
        if: ${{ !inputs.all }}
        run: sleep 240
      - name: Submit changed and key pages
        run: python3 scripts/indexnow.py ${{ inputs.all && '--all' || '' }}
