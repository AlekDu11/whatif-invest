name: Crypto exchange rankings

on:
  schedule:
    - cron: '11 3 * * *'    # daily 03:11 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: exchanges
  cancel-in-progress: false

jobs:
  exchanges:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exchanges from CoinGecko
        run: python scripts/fetch_exchanges.py
      - name: Commit
        run: |
          git config user.name "whatif-bot"
          git config user.email "whatif-bot@users.noreply.github.com"
          git add data/exchanges.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Exchanges $(date -u +%F)"
          git pull --rebase -X theirs || (git rebase --abort; git pull --rebase -X theirs)
          git push
