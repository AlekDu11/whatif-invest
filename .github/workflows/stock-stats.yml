name: Stock key statistics

on:
  schedule:
    - cron: '41 4 * * *'    # daily 04:41 UTC, after the price run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - name: Fetch key stats (rotating, stalest first)
        run: python scripts/stock_stats.py
      - name: Commit
        run: |
          git config user.name "whatif-bot"
          git config user.email "whatif-bot@users.noreply.github.com"
          git add data/stockstats.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Stock stats $(date -u +%F)"
          git pull --rebase -X theirs || (git rebase --abort; git pull --rebase -X theirs)
          git push
