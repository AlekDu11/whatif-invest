name: Probe external API (manual)
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test_chart.js
      - name: Official Binance Web3 key works on the live site?
        env: { KEY: "${{ secrets.ALERTS_KEY }}" }
        run: curl -sSL --max-time 30 "https://whatifstack.com/api/chart?dex=w3&w3test=$KEY"; echo
