name: Telegram bot setup
# One click instead of opening /api/tg?setup=<ALERTS_KEY> by hand: connects the bot's webhook, commands, descriptions and menu button.
on:
  workflow_dispatch: {}
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Connect the bot
        env:
          KEY: ${{ secrets.ALERTS_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "ALERTS_KEY secret not set"; exit 1; fi
          curl -sS -L --max-time 60 "https://whatifstack.com/api/tg?setup=$KEY" | head -c 2000; echo
      - name: Webhook status (no secrets printed)
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          KEY: ${{ secrets.ALERTS_KEY }}
        run: |
          curl -sS --max-time 30 "https://api.telegram.org/bot$TOKEN/getWebhookInfo" | python3 -c "import json,sys; r=json.load(sys.stdin).get('result',{}); print({k: r.get(k) for k in ('url','pending_update_count','last_error_date','last_error_message','allowed_updates')})"
          curl -sS -L --max-time 30 "https://whatifstack.com/api/tg?stats=$KEY" | head -c 800; echo
