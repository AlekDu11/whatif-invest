name: Scheduled deploy

# Vercel builds only commits with [deploy] in the message (scripts/vercel_ignore.sh), to stay under the
# 10 GB deployment-storage limit of the Hobby plan (one deploy is 1.5–2.5 GB). ONE deploy a day (owner, 2026-11-20),
# in the morning after the market wrap, only when the site changed. GitHub fires scheduled runs of this repo very rarely (4 times in
# 36 h on 2026-11-19), so the check also runs on every push to main and after the data workflows finish: whichever
# comes first after the 5 h 50 min mark deploys. A plain manual run follows the same rule; only force=true deploys
# now, and even then at most 6 deploys per 24 h.
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
  workflow_run:
    workflows: ['Fetch market data', 'Crypto exchange rankings']
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Urgent fix: deploy now (still max 6 deploys per 24 h)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scheduled-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 500
      - name: Request a deploy if the site changed
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          last=$(git log -1 --format=%H --grep='\[deploy\]' || true)
          if [ -n "$last" ]; then
            changed=$(git diff --name-only "$last" HEAD -- . ':(exclude)social' ':(exclude)ads' ':(exclude)reports' ':(exclude)CLAUDE.md' ':(exclude)README.md' | head -1)
          else
            changed=yes
          fi
          if [ -z "$changed" ]; then echo "Nothing to deploy"; exit 0; fi
          if [ "${{ inputs.force }}" = "true" ]; then
            n=$(git log --since='24 hours ago' --format=%s | grep -c '\[deploy\]' || true)
            if [ "$n" -ge 6 ]; then echo "Already $n deploys in 24 h — waiting for the next slot"; exit 0; fi
          elif [ -n "$last" ]; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct "$last") ))
            h=$(date -u +%H)
            # owner 2026-11-20: ONE deploy a day, in the morning after the market wrap (≥ 05:00 UTC = 08:00 Kyiv);
            # if a day was missed (> 30 h), deploy at the next check whatever the hour
            if [ "$age" -lt 86400 ]; then echo "Last deploy ${age}s ago — one deploy a day (24 h, so the previous copy has expired from Vercel storage)"; exit 0; fi
            if [ "$h" -lt 5 ] && [ "$age" -lt 108000 ]; then echo "Waiting for the morning window (05:00 UTC)"; exit 0; fi
          fi
          if [ -n "$HOOK" ]; then          # preferred: Vercel Deploy Hook (git auto-deploys are off, so pushes cost nothing)
            curl -fsS -X POST "$HOOK" && git config user.name "whatif-bot" && git config user.email "whatif-bot@users.noreply.github.com" \
              && git commit --allow-empty -m "Scheduled deploy via hook [deploy]" && (git pull --rebase -X theirs || true) && git push
            exit 0
          fi
          git config user.name "whatif-bot"
          git config user.email "whatif-bot@users.noreply.github.com"
          git commit --allow-empty -m "Scheduled deploy [deploy]"
          git pull --rebase -X theirs || true
          git push
